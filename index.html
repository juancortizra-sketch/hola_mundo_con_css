<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola Mundo con Imagen</title>
    
    <!-- 
        Ruta para el CSS:
        - Si index.html está en la raíz: href="css/styles.css"
        - Si index.html está dentro de /index: href="../css/styles.css"
    -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- 1. TÍTULO EN LA PARTE SUPERIOR Y CENTRADO -->
    <header class="header-title">
        <h1>¡Hola Mundo!</h1>
    </header>

    <!-- 2. IMAGEN DESCARGA.PNG CENTRADA EN LA MITAD DE LA PANTALLA -->
    <main class="center-content">
        <!-- 
            Ruta de la imagen:
            - Si index.html está en la raíz: src="descarga.png"
            - Si index.html está dentro de /index: src="../descarga.png"
        -->
        <img src="descarga.png" alt="Ícono de pantalla con bombillo" class="center-image">
    </main>

</body>
</html>
